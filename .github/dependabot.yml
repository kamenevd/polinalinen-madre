version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 3
    groups:
      android-toolchain:
        patterns: ["com.android.*", "org.jetbrains.kotlin.*", "androidx.compose*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:30"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 3
