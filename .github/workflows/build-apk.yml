name: Build debug APK

# gradlew/gradle-wrapper.jar сгенерированы и лежат в репозитории с
# 2026-07-21 — собираем и тестируем через обёртку, не голым `gradle`.
#
# Предполагается, что этот файл лежит в madre-v4/.github/workflows/, то есть
# madre-v4/ — корень git-репозитория. Если структура другая (например, весь
# Мадре/ — один репозиторий), поправь working-directory ниже.

on:
  push:
    branches: [ main, master, v4-dev ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Прогнать unit-тесты
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Собрать debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Загрузить APK как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: madre-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
