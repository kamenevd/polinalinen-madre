name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      capture_baseline:
        description: Re-render immutable60985a8 comparison (expensive, manual only)
        type: boolean
        default: false
  schedule:
    # Takes effect only after an explicitly approved merge into default branch.
    - cron: "30 1 * * *"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:
  workflow-contract:
    name: Workflow integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate workflow state and control plane
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/cycle.py validate

  android-quality:
    name: Android quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MADRE_BUILD_TOOLS_VERSION: "36.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install pinned QA verification tools
        run: sdkmanager "build-tools;${MADRE_BUILD_TOOLS_VERSION}"
      # SIGNING_PRESERVE_706_V1: no new QA key, no APK delivery until the
      # original 7.0.6 identity is available. Compile/tests/PNG continue.
      # No signing inputs means an unsigned checks-only build, not a fallback key.
      - name: Compile, domain tests, style boundary, 20 key native frames and unsigned checks-only APK
        run: ./gradlew compileDebugKotlin compileReleaseKotlin testDebugUnitTest assembleDebug --no-daemon --stacktrace --no-configuration-cache
      - name: Extended visual verification (manual, nightly and RC)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: ./gradlew testDebugUnitTest verifyRoborazziDebug -Pmadre.extendedVerification=true --no-daemon --stacktrace --no-configuration-cache
      - name: Native412 comparison from immutable60985a8 app sources
        if: github.event_name == 'workflow_dispatch' && inputs.capture_baseline
        run: python3 scripts/capture_style_baseline.py

      - name: Upload key native PNG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: madre-key-png
          path: app/build/outputs/roborazzi/key/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-quality-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/roborazzi/
          if-no-files-found: warn
          retention-days: 14


  lint-report:
    name: Lint (report only)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Lint warnings do not block PR or APK
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon --stacktrace
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

  instrumented-smoke:
    name: Instrumented smoke
    # Keep the protected check name; PR/push is SKIPPED, not a passed smoke.
    # RC release gate still requires a real success at this exact SHA.
    # SIGNING_PRESERVE_706_V1: an unsigned candidate cannot be installed for smoke.
    # Restoring this optional job requires the original identity, not a new key.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable KVM
        # The optional device job must use the same QA identity, never an ephemeral debug key.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator smoke tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 412x915
            adb shell wm density 160
            adb shell wm size
            adb shell wm density
            adb shell settings put secure immersive_mode_confirmations confirmed
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace --no-configuration-cache
            mkdir -p screenshots
            adb pull /sdcard/googletest/test_outputfiles/screenshots screenshots/ || true
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-smoke-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Razvorot screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: madre-screenshots
          path: |
            screenshots/
            app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: error
          retention-days: 14
