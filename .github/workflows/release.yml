name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  checks: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # apksigner is pinned to the Build Tools that AGP uses to sign the release, so
  # the runner image shipping a newer SDK cannot change the verifier's apksigner
  # or its output format. Must stay equal to PINNED_BUILD_TOOLS_VERSION in
  # scripts/verify_apk_signature.py; test_workflow_contract.py enforces that.
  MADRE_BUILD_TOOLS_VERSION: "34.0.0"

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    # Up to 40 minutes waiting for the quality checks (see
    # DEFAULT_TIMEOUT_SECONDS in scripts/verify_github_release_context.py) plus
    # the signed build itself. The job must never be the thing that gives up
    # mid-Gradle; test_workflow_contract.py enforces the margin.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch --no-tags --force origin main:refs/remotes/origin/main

      - name: Verify tagged commit is on main
        run: |
          # A tag pushed in the same breath as the merge can reach the release
          # runner before origin/main advertises the commit. Short bounded
          # retry; still a hard failure if the commit never shows up on main.
          for attempt in 1 2 3 4 5; do
            if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "tagged commit ${GITHUB_SHA} is on main"
              exit 0
            fi
            echo "attempt ${attempt}: ${GITHUB_SHA} not visible on origin/main yet"
            if [ "${attempt}" -lt 5 ]; then
              sleep 10
              git fetch --no-tags --force origin main:refs/remotes/origin/main
            fi
          done
          echo "tagged commit ${GITHUB_SHA} is not an ancestor of origin/main"
          exit 1

      - name: Verify required quality checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify_github_release_context.py
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install pinned build tools
        run: |
          test -n "${ANDROID_HOME}"
          if [ ! -x "${ANDROID_HOME}/build-tools/${MADRE_BUILD_TOOLS_VERSION}/apksigner" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
              "build-tools;${MADRE_BUILD_TOOLS_VERSION}"
          fi
          test -x "${ANDROID_HOME}/build-tools/${MADRE_BUILD_TOOLS_VERSION}/apksigner"

      - name: Verify tag, state and signing inputs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MADRE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MADRE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MADRE_KEY_PASSWORD }}
          MADRE_KEYSTORE_BASE64: ${{ secrets.MADRE_KEYSTORE_BASE64 }}
          MADRE_SIGNING_CERT_SHA256: ${{ secrets.MADRE_SIGNING_CERT_SHA256 }}
        run: |
          python3 scripts/cycle.py validate
          python3 scripts/release_cycle.py plan
          python3 -c 'import json, os, sys; v=json.load(open("workflow/CYCLE.yaml"))["cycle"]["version"]; sys.exit(0 if f"v{v}" == os.environ["GITHUB_REF_NAME"] else 1)'
          test -n "${MADRE_KEYSTORE_BASE64}"
          test -n "${KEYSTORE_PASSWORD}"
          test -n "${KEY_ALIAS}"
          test -n "${KEY_PASSWORD}"
          test -n "${MADRE_SIGNING_CERT_SHA256}"

      - name: Materialize release keystore
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          MADRE_KEYSTORE_BASE64: ${{ secrets.MADRE_KEYSTORE_BASE64 }}
        run: printf '%s' "${MADRE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"

      - name: Test and build signed release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.MADRE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MADRE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MADRE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon --stacktrace

      - name: Remove release keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release-keystore.jks"

      - name: Package and verify release artifacts
        env:
          MADRE_SIGNING_CERT_SHA256: ${{ secrets.MADRE_SIGNING_CERT_SHA256 }}
        run: |
          APK=$(python3 -c 'from pathlib import Path; files=list(Path("app/build/outputs/apk/release").glob("*.apk")); print(files[0] if len(files) == 1 else "")')
          test -n "${APK}"
          python3 scripts/verify_apk_signature.py "${APK}"
          python3 scripts/release_cycle.py package --repo-root . --apk "${APK}" --output dist --current-tag "${GITHUB_REF_NAME}"
          MANIFEST=$(find dist -name '*-manifest.json' -type f -print -quit)
          python3 scripts/release_cycle.py verify "${MANIFEST}"

      - name: Generate source and APK SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          artifact-name: madre-sbom.spdx.json
          output-file: dist/madre-sbom.spdx.json
          format: spdx-json

      - name: Publish immutable GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
